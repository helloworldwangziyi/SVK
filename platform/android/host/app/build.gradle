plugins {
    id 'com.android.application'
}

android {
    namespace 'com.estarx.vulkanhost'
    compileSdk 34

    defaultConfig {
        applicationId '@EVK_APP_IDENTIFIER@'
        minSdk 24
        targetSdk 34
        versionCode @EVK_APP_VERSION_CODE@
        versionName '@EVK_APP_VERSION_NAME@'
        resValue 'string', 'app_name', '@EVK_APP_DISPLAY_NAME@'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                abiFilters 'arm64-v8a'
            }
        }
    }

    sourceSets {
        main {
            java {
                srcDirs 'src/main/java', '@EVK_ROOT@/platform/android/java'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
