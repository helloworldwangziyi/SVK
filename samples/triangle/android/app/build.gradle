plugins {
    id 'com.android.application'
}

android {
    namespace 'com.estarx.vulkanhost'
    compileSdk 34

    defaultConfig {
        applicationId 'com.estarx.triangle'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        resValue 'string', 'app_name', 'estarx 三角形'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                abiFilters 'arm64-v8a'
            }
        }
    }

    sourceSets {
        main {
            java {
                srcDirs 'src/main/java', file('../../../../platform/android/java')
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
