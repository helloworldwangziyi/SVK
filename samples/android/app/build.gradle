plugins {
    id 'com.android.application'
}

android {
    namespace 'com.estarx.vulkansample'
    compileSdk 34

    defaultConfig {
        applicationId 'com.estarx.vulkansample'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                abiFilters 'arm64-v8a'
            }
        }
    }

    // 平台薄壳的 Java 层直接编进示例 App（与母项目同款约定）。
    sourceSets {
        main {
            java {
                srcDirs 'src/main/java', '../../../platform/android/java'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
